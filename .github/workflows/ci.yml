name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/LoremIpsum.slnx

      - name: Build
        run: dotnet build src/LoremIpsum.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution src/LoremIpsum.slnx --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
